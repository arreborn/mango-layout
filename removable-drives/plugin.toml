id           = "arreborn/removable-drives"
name         = "Removable Drives"
version      = "1.0.0"
plugin_api   = 42
author       = "arreborn"
license      = "MIT"
icon         = "usb"
description  = "Detects removable partitions and lets you mount/unmount them from the bar."

[[widget]]
id    = "drives"
entry = "widget.luau"

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 280
height          = "content"
max_height      = 400
placement       = "attached"
open_near_click = true

[[service]]
id    = "service"
entry = "service.luau"
